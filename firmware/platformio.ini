; PlatformIO Project Configuration File for B.R.A.V.O. Firmware
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ── Raspberry Pi Pico W  ───────────────────────────────────────────────────
; Hardware: Pico W (RP2040) + RYLR896 LoRa + GPS NEO-7m + SSD1306 OLED

; ────────────────────────────────────────────────────────────────────────────
[env:rpicow]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino

; Serial Monitor (USB CDC)
monitor_speed = 115200

; Build flags
; Set DEVICE_ADDRESS=1 on the beacon unit, DEVICE_ADDRESS=2 on the relay unit
build_flags =
    -D DEVICE_ADDRESS=1
    -D TARGET_ADDRESS=2

; Only compile Pico W source files — exclude leftover ESP32-only modules and
; the standalone HI-test entry point (has its own setup()/loop(), see
; env:rpicow_hi_test).
; Patterns are relative to src_dir (src/), so no path prefix is needed.
src_filter = +<*> -<BLEConfig.cpp> -<IMU.cpp> -<OTA.cpp> -<Telemetry.cpp> -<main_hi_test.cpp>

; Library dependencies
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.3
    adafruit/Adafruit BusIO@^1.14.1

; Upload options
; From a Raspberry Pi 4B connect the Pico W via USB while holding BOOTSEL,
; then PlatformIO uploads the UF2 image automatically via picotool.
upload_protocol = picotool

; ── HI Test — minimal OLED sanity check (no GPS/LoRa) ───────────────────────
; Flash this to both boards to confirm displays work before debugging comms:
;   pio run -e rpicow_hi_test --target upload
[env:rpicow_hi_test]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
monitor_speed = 115200
src_filter = -<*> +<main_hi_test.cpp> +<Display.cpp>
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.3
    adafruit/Adafruit BusIO@^1.14.1
upload_protocol = picotool